<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AetherSync Dev Console</title>
    <style>
      body {
        font-family: monospace;
        padding: 20px;
        background: #1a1a1a;
        color: #eee;
      }
      button {
        padding: 10px 15px;
        cursor: pointer;
        background: #333;
        color: #fff;
        border: 1px solid #555;
        margin-right: 10px;
      }
      button:hover {
        background: #444;
      }
      #logs {
        margin-top: 20px;
        border-top: 1px solid #444;
        padding-top: 10px;
        max-height: 400px;
        overflow-y: auto;
      }
      .log-entry {
        margin-bottom: 5px;
        border-left: 3px solid #00ff00;
        padding-left: 10px;
      }
      .error {
        border-left-color: #ff0000;
        color: #ffaaaa;
      }
    </style>
  </head>
  <body>
    <h1>AetherSync: System Status (No-React)</h1>
    <div id="controls">
      <button id="btn-init">1. Init DB</button>
      <button id="btn-add">2. Add Random Ops (Batch)</button>
      <button id="btn-read">3. Read All</button>
    </div>
    <div id="logs"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
